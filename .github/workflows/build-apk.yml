name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Grant execute permission for gradlew
        run: |
          cd mobile_minecraft
          chmod +x gradlew

      - name: Build APK
        run: |
          cd mobile_minecraft
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Minecraft-Clone-APK
          path: mobile_minecraft/app/build/outputs/apk/debug/app-debug.apk
