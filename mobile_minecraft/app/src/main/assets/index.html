<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mobile Minecraft Clone</title>
    <style>
        body {
    margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
}
        canvas {
    display: block; width: 100vw; height: 100vh;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
}
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            margin-top: -10px; margin-left: -10px;
            pointer-events: none; z-index: 100;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: white; mix-blend-mode: difference;
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        /* Mobile Controls */
        #controls-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 100;
            display: flex; justify-content: center; align-items: center;
        }
        #stick {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
        }
        #action-buttons {
            position: absolute; bottom: 30px; right: 30px;
            display: flex; gap: 15px; z-index: 100;
        }
        .btn {
            width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid white;
            border-radius: 50%; color: white;
            font-weight: bold; font-size: 14px;
            display: flex; justify-content: center; align-items: center;
            user-select: none;
        }
        .btn:active { background: rgba(255, 255, 255, 0.8); color: black; }

        #inventory {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 5px; z-index: 100;
            background: rgba(0,0,0,0.5); padding: 5px;
            border-radius: 5px;
        }

        .slot {
            width: 48px; height: 48px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 2px solid #555;
            background-size: cover;
            position: relative;
        }
        .slot.active { border-color: yellow; }
        .count {
            position: absolute; bottom: 2px; right: 2px;
            color: white; font-size: 12px; font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }


        .dpad-btn {
            position: absolute;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            color: white; font-weight: bold;
            user-select: none;
        }
        .dpad-btn:active { background: rgba(255, 255, 255, 0.7); color: black; }

    </style>
    <! Three.js CDN >
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>


    <! Hotbar >
    <div id="hotbar" class="ui-layer" style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; z-index: 150;">
        <div id="hotbar-slots" style="display: flex; gap: 5px;"></div>
    </div>

    <! Full Inventory >
    <div id="inventory-ui" class="ui-layer" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; z-index: 200; width: 80%; max-width: 400px;">
        <h2 style="color: white; margin-top: 0;">Inventory</h2>
        <div id="inv-grid" style="display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; margin-bottom: 20px;"></div>

        <h3 style="color: white;">Crafting</h3>
        <div style="display: flex; gap: 20px; align-items: center;">
            <div id="craft-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px;">
                <div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div>
            </div>
            <div style="color: white; font-size: 24px;">&rarr;</div>
            <div class="slot" id="craft-result"></div>
        </div>
    </div>
